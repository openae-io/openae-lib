version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - build-essential
    - cmake
    - doxygen
  jobs:
    # RTD seeds an old pip into the venv; --group needs pip >= 25.1
    install:
      - python -m pip install --upgrade pip
      - python -m pip install . --group docs

sphinx:
  configuration: docs/conf.py
